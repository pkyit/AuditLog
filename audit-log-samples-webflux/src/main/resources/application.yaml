server:
  port: 19600

# 核对"到底起了哪个容器"：Tomcat 会打印 Tomcat started on port，Netty 会打印 Netty started
logging:
  level:
    root: INFO
    io.github.pkyit.auditlog: DEBUG

audit:
  log:
    store:
      type: json-file
      directory: ./target/webflux-audit
    journal:
      directory: ./target/webflux-journal
    chain:
      enabled: true
      secret: webflux-sample-secret
      state-file: ./target/webflux-chain-state.properties
