# 场景 A：审计完全关闭（两个采集通道都关）
#
# 这是**真正的零审计基线**。原设计文章压测用的是"标注了注解但三个采集开关全关"的端点，
# 那条路径仍会生成审计记录，因此它不是零审计基线。
#
# 注意必须显式关闭启动校验：本 profile 关闭方法级采集，而示例里有 13 个方法标注了
# @AuditLog —— 这构成"配置矛盾"，启动校验默认会让应用启动失败（这是正确的设计，
# 它防止使用者误以为审计在生效）。压测场景是有意为之，因此显式降级为告警。
audit:
  log:
    collector:
      boundary:
        enabled: false
      method:
        enabled: false
    validation:
      fail-on-mismatch: false
